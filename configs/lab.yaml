# Agentics AI Research Lab — runtime configuration
# YAML values override .env where present. Secrets NEVER go here.

# --- Swarm ---------------------------------------------------------------
max_agents: 10
cycle_pause_seconds: 60
claim_ttl_minutes: 45
evolution_every_n_cycles: 10   # 0 = never open self-evolution issues

# --- Research ------------------------------------------------------------
research_topic: "AI/ML for Network Function Virtualization (NFV) and 5G core automation"
# P18b research fan-out (agentics/graph/nodes.py): > 1 asks complementary
# angles (benchmarks / open problems / production experience) IN PARALLEL on
# other Hyperbrowser tokens of the pool — 2 = survey + 1 angle, 3 = all
# three. Every angle passes the P20 budget gate; 1 disables the fan-out.
# Live 2026-11-13: the pool grew to 7 tokens, so all three angles now run
# as genuinely parallel cloud sessions (they used to fall back to the
# sequential same-view path on the one-token lab).
research_fanout: 3
# Solo-lab unblock: when the pool has fewer identities than angles (e.g. ONE
# Hyperbrowser token), the extra angle still runs — sequentially on the
# agent's own pinned view, never parallel on one session. false restores the
# strict single-ask behaviour for 1-identity pools.
research_same_view_angle: true

# --- Role assignment ------------------------------------------------------
# Fixed mapping account index (1-based) -> role. Leave EMPTY (as below) for
# the adaptive default: a lone agent researches (a single-token lab pinned to
# supervisor would scan the backlog forever without ever calling the LLM),
# two agents become supervisor+researcher, larger swarms round-robin with
# supervisor/integrator guaranteed. Pin explicit roles ONLY when your token
# pool matches this exact size — a fixed 9-slot map on a 1-token deployment
# is what left the CLI run scanning instead of researching (2026-11-13).
#
# role_map:
#   1: supervisor
#   2: researcher
#   3: researcher
#   4: coder
#   5: coder
#   6: writer
#   7: reviewer
#   8: reviewer
#   9: integrator

# --- Ownership matrix (P3 in docs/POLICIES.md) -----------------------------
# Writable research surface per role. The lab's own code (agentics/, configs/,
# accounts/, scripts/, .github/) is OUT OF BOUNDS for every role — see
# protected_paths below (P10).
ownership:
  coder:    ["experiments/", "tests/", "benchmarks/"]
  researcher: ["research_notes/"]
  writer:   ["docs/", "README.md", "README*"]
  integrator: ["reports/"]
  supervisor: []

# --- P10 protected paths (anti "AI sửa nhầm code agent") --------------------
# Hard-blocked for ALL agents at write time, diff time and merge time.
# Owner exception per task: python -m agentics.cli allow-protected <task_id>
# Run-wide emergency switch: ALLOW_PROTECTED_PATHS=1 (still blocks accounts/
# and configs/secrets.yaml — credentials are never writable).
protected_paths:
  - agentics/
  - configs/
  - accounts/
  - scripts/
  - .github/

# --- P14 whitelist ring ("cấm tuyệt đối" — vòng ngoài của ownership) ----------
# Khi được đặt, MỌI file ngoài các gốc này bị từ chối với mọi agent (lớp
# ownership P3 phân vai bên trong; vòng này chặn toàn bộ phần còn lại).
# Owner exemption theo task vẫn nâng được vòng này, nhưng accounts/ và
# configs/secrets.yaml không bao giờ được chạm. Bỏ trống ([]) để tắt.
# Mặc định = hợp của các vùng ownership phía trên.
writable_roots:
  - research_notes/
  - experiments/
  - benchmarks/
  - tests/
  - docs/
  - reports/
  - README.md

# --- P13 file locks (anti "hai agent đè tay nhau") ----------------------------
# Khóa khai báo ở bước plan, TTL tự hết hạn khi agent chết.
file_lock_ttl_minutes: 30

# --- P10 lớp 4 — integrity self-healing ---------------------------------------
# Re-hash cây protected trong mỗi workspace rồi tự phục hồi từ git nếu bị
# một script lạc ghi đè. 0 = tắt.
integrity_interval_s: 20

# --- Perplexity ------------------------------------------------------------
pplx_timeout: 180

# --- Free keyless research tools (docs/FREE_TOOLS.md) -------------------------
# Official publisher APIs (arXiv / OpenAlex / Crossref / Semantic Scholar /
# Europe PMC / GitHub / PyPI / HuggingFace / Wikipedia / DuckDuckGo): real
# metadata, no key. node_research falls back to them when the LLM pools are
# dead; search_all runs three scholarly budgets in parallel and the
# verification toolkit (repos / PyPI pins / datasets / models) grounds every
# finding in real code + data instead of scraped <title> tags.
free_tools_enabled: true
free_tools_timeout: 15
# Optional polite-pool email for OpenAlex/Crossref (recommended in prod).
# Keep it commented unless you want YAML to win over FREE_TOOLS_MAILTO in
# .env — an empty string here would clear the env value.
# free_tools_mailto: "you@example.org"

# --- Browser backend --------------------------------------------------------
# "hyperbrowser" = Perplexity cookie sessions run on a Hyperbrowser cloud
# browser (stealth + residential proxy) — required on datacenter IPs, where
# the raw cookie WebSocket is 403-blocked. "local" = raw WebSocket from this
# machine (residential networks only).
browser_backend: hyperbrowser
hyperbrowser_proxy_country: US
hyperbrowser_timeout: 900
# The API key lives in configs/secrets.yaml (gitignored) as
#   hyperbrowser_api_key: hb_...
# or in the HB_API_KEY environment variable. It is NEVER committed here.

# --- Adaptive planning & role prompts (LLM-authored) -------------------------
# The LLM writes its own role missions (cached swarm-wide in the role_prompts
# table, reworked after repeated failures, conditioned on recent traces) and
# PROPOSES each plan itself (approach-first, extra fields of its own naming)
# on top of the minimal machine contract. The immutable collaboration rules
# are appended by code to every prompt and cannot be rewritten by the model.
adaptive_prompts: true
role_prompt_ttl_hours: 24      # re-synthesize a mission after this many hours
role_prompt_max_chars: 1600    # hard cap for a synthesized mission
role_prompt_rework_failures: 2 # consecutive failed cycles trigger a rework

# --- Co-Scientist tournament (agentics/coscientist) -------------------------
# Ported from the Apache-2.0 re-implementation of Gottweis et al. 2026
# ("Accelerating scientific discovery with Co-Scientist", Nature 655):
# an Elo tournament ranks hypotheses by simulated scientific debate, an
# evolution operator breeds the next generation from the top ratings, and
# a meta-review distils win/loss patterns into steering feedback.
# A QUALITY loop on top of the P16 TRUTH loop — Elo never settles a claim,
# only code run does. Every ask passes the P20 budget gate; the node is
# failure-isolated from the research cycle.
tournament_enabled: true
tournament_matches_per_cycle: 2   # debates per researcher cycle (budget-bounded)
evolution_per_cycle: 1            # breeding asks per cycle (0 = off)
evolution_top_k: 3                # Elo-top pool the evolution draws from
meta_review_window: 4             # decisive debates before a feedback synthesis

# --- P16-R protocol self-repair (Reflection on failed experiments) ----------
# When a hypothesis protocol is inconclusive, the author gets N bounded
# repair rounds: the machine failure note is fed back, the script is
# rewritten ONCE, and the SAME frozen-criterion adjudication re-runs.
# 0 = off. The verdict stays 100% machine — repair fixes the script.
verify_protocol_repair_rounds: 1

# --- Dual-model jury (anti "một model phán mọi thứ") -------------------------
# When "chatgpt", every tournament debate is judged by TWO independent model
# families CONCURRENTLY: the primary Perplexity jury and a ChatGPT cookie
# session on the same Hyperbrowser edge (live-verified 2026-11-13). Both
# verdicts must AGREE before Elo moves; disagreement records a `contested`
# match with NO Elo movement + a `tournament_contested` journal event for
# the owner. A judge outage/unparseable answer degrades to the primary
# verdict with an explicit rationale note — never silently. The judge ask
# passes the same P20 budget gate (purpose tournament_judge2).
judge_second_provider: "chatgpt"
# Path to the chatgpt.com Cookie-Editor export for the judge account
# (gitignored). Long-lived session-token cookies carry the login; the
# short-lived edge cookies are dropped automatically.
chatgpt_cookie_path: "accounts/chatgpt-01.json"
