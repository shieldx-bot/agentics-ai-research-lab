# ollama.service systemd drop-in — RAM-tight host hardening.
#
# Why: llama.cpp's prompt cache grows per DISTINCT prompt while the model
# is loaded, capped ~8 GiB and NOT configurable upstream (ollama#17351).
# Live 2026-11-14: the kernel OOM-killer killed llama-server TWICE in one
# day (10:35, ~13:43) — global OOM, anon-rss ~6 GB — because cache slots
# scaled with the model-default context window (~238 MiB each, ~30-slot
# LRU ≈ 7 GB).
#
# The lab already pins num_ctx: 4096 and keep_alive: 5m per request
# (LOCAL_LLM_NUM_CTX / LOCAL_LLM_KEEP_ALIVE). This unit-level layer adds:
#   * one parallel slot — OLLAMA_NUM_PARALLEL>1 duplicates cache slots;
#   * q8_0 KV cache — half the per-slot state, negligible quality loss
#     for plumbing purposes (extract/plan/reflect);
#   * a cgroup memory ceiling — a runaway llama-server gets contained and
#     restarted BY THE UNIT instead of a global OOM killing desktop apps
#     or the lab with it.
#
# Install (once):
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp configs/ollama-hardening.conf /etc/systemd/system/ollama.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
# Verify:
#   systemctl show ollama -p Environment -p MemoryMax
#
# Tune MemoryMax to the host: model (~1.7 GB) + num_ctx-capped cache slots
# + headroom. 4G contains well within a 8 GB host; raise on bigger boxes.
# If ollama is the ONLY heavy workload, prefer 6G and let the cache live.

[Service]
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
Environment="OLLAMA_KEEP_ALIVE=5m"
Environment="OLLAMA_MAX_QUEUE=8"
# Contain, don't let a global OOM decide who dies (cgroup v2).
MemoryHigh=3G
MemoryMax=4G
# Ollama upstream ships Restart=always with RestartSec=3 — keep explicit
# so a MemoryMax kill self-heals in seconds.
Restart=always
RestartSec=3
