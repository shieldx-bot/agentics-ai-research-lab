# =============================================================================
# Agentics AI Research Lab — THE single config file template
#
# Copy to configs/secrets.yaml and fill in real values:
#     cp configs/secrets.example.yaml configs/secrets.yaml
# That file is GITIGNORED (never commit it) and wins over everything else:
#     env vars (+ optional legacy .env)  ->  configs/lab.yaml (deprecated)
#                                        ->  configs/secrets.yaml  (WINS)
# Every key below is optional — anything absent falls back to the code
# default in agentics/config.py. Key = Settings field name (snake_case).
# =============================================================================

# ---- Credentials (per-deployment) -------------------------------------------
# GitHub PAT — local mode doesn't need it (origin = data/lab.git); kept for
# the dormant github_ops modules and owner-side tooling.
github_token: "ghp_..."

# OmniRoute gateway API key (dashboard "API Keys" page) — required when the
# lab talks to the gateway from another machine (LAN / tunnel), optional for
# plain localhost. Empty string = no Authorization header at all.
# local_llm_api_key: ""

# Hyperbrowser tokens (browser backend "hyperbrowser"): 1 token = 1 cloud
# session, so K tokens scale the swarm to K parallel agents. Find them at
# https://app.hyperbrowser.ai/overview.
# hyperbrowser_api_key: "hb_..."
# hyperbrowser_api_keys:
#   - "hb_token_1"
#   - "hb_token_2"
#   - "hb_token_3"

# Dual-model jury: Cookie-Editor export of the chatgpt.com judge account
# (accounts/ is gitignored). Default path below; comment out to disable.
# chatgpt_cookie_path: "accounts/chatgpt-01.json"

# ---- Local LLM tier (OmniRoute — THE local edge) ----------------------------
# npm i -g omniroute && omniroute   ->  http://localhost:20128/v1
# Audit:  python scripts/probe_omnirouter.py --ask
# local_llm_enabled: true
# local_llm_url: "http://127.0.0.1:20128/v1"     # LAN: http://192.168.x.x:20128/v1
# local_llm_backend: "omniroute"                 # omniroute | ollama | auto
# local_llm_model: "nvidia/nemotron-3-ultra-550b-a55b"
# local_llm_vl_model: "nvidia/nemotron-3-vl"     # vision tier (reserved)
# local_llm_timeout: 120.0
# local_llm_num_predict: 512

# ---- Swarm -------------------------------------------------------------------
# max_agents: 10                 # also = number of cookie/token identities
# cycle_pause_seconds: 60
# claim_ttl_minutes: 45
# backlog_watermark: 2           # supervisor keeps >= N unclaimed tasks

# ---- Research -----------------------------------------------------------------
# research_topic: "AI/ML for Network Function Virtualization (NFV) and 5G core automation"
# research_fanout: 3             # 1 = single angle; 2-3 = parallel angles
# research_same_view_angle: true

# ---- Roles & ownership (P3) ---------------------------------------------------
# Fixed role per 1-based account index; empty = adaptive assignment.
# role_map:
#   1: supervisor
#   2: researcher
# Ownership matrix override (default lives in agentics/policies/ownership.py).
# ownership:
#   coder:    ["experiments/", "tests/", "benchmarks/"]
#   researcher: ["research_notes/"]
#   writer:   ["docs/", "README.md"]
#   integrator: ["reports/"]
#   supervisor: []

# ---- P10 protected paths / P14 whitelist ring --------------------------------
# protected_paths: ["agentics/", "configs/", "accounts/", "scripts/", ".github/"]
# writable_roots: ["research_notes/", "experiments/", "benchmarks/", "tests/", "docs/", "reports/", "README.md"]

# ---- Dashboard -----------------------------------------------------------------
# dashboard_port: 8080

# ---- Advanced add-ons ---------------------------------------------------------
# LLM cascade when the pool refuses allowed purposes ("" = off):
# llm_cascade_provider: ""
# llm_cascade_purposes: "research,plan,implement"
# MCP bridge — OWNER-approved stdio servers as a JSON map. Empty = no-op.
# mcp_servers: {"arxiv": "python -m mcp_server_arxiv"}
# Learned risk gate: off | shadow | soft
# risk_gate_mode: shadow
