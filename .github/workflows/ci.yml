name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q agentics tests
      - name: Run tests
        run: python -m pytest -q -x
      - name: Lint
        run: >-
          python -m ruff check agentics/config.py agentics/github_ops/repo_workspace.py
          agentics/memory/lifemem.py tests/test_lifemem.py tests/test_repo_workspace.py
